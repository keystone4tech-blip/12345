# ==============================================================
# NGINX REVERSE PROXY ДЛЯ PRODUCTION (MOZHNOVPN)
# ==============================================================
# Этот конфиг размещается на хост-сервере:
#   /etc/nginx/sites-available/mozhnovpn
#
# Обеспечивает:
# - lk.mozhnovpn.tech → Личный Кабинет (корень /)
# - lk.mozhnovpn.tech/api/ → Bot API (бэкенд)
# - SSL через Let's Encrypt (Certbot)
# ==============================================================

# 1. HTTP -> HTTPS Редирект
server {
    listen 80;
    server_name lk.mozhnovpn.tech;
    return 301 https://$host$request_uri;
}

# 2. Основной HTTPS сервер
server {
    listen 443 ssl http2;
    server_name lk.mozhnovpn.tech;

    # SSL Сертификаты
    ssl_certificate /etc/letsencrypt/live/lk.mozhnovpn.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk.mozhnovpn.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Личный кабинет (Frontend) ----
    # Работает на корне домена для совместимости со старыми ссылками
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Поддержка SPA (отправка всех 404 на index.html)
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # ---- Bot API (Backend) ----
    # Все запросы к API проксируются на порт 8080
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Увеличенные таймауты для API
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}
