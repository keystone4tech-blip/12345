# ============================================
# Кабинет + Bot API (lk.mozhnovpn.tech)
# ============================================
server {
    listen 80;
    server_name lk.mozhnovpn.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lk.mozhnovpn.tech;

    ssl_certificate /etc/letsencrypt/live/lk.mozhnovpn.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk.mozhnovpn.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Кабинет (Теперь на корне /) ----
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Обработка SPA-роутинга
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # ---- Bot API ----
    location /api/ {
        # ВАЖНО: без слэша в конце, чтобы передавать путь как есть
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}
